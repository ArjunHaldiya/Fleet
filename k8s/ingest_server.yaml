apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-server
  namespace: fleet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ingest-server
  template:
    metadata:
      labels:
        app: ingest-server
    spec:
      containers:
        - name: ingest-server
          image: fleet:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fleet-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-server
  namespace: fleet
spec:
  selector:
    app: ingest-server
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer